<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Body Bank</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1.5rem); }
    .pt-safe { padding-top: env(safe-area-inset-top, 1rem); }
    
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .animate-tab { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    ::-webkit-scrollbar { display: none; }
    .btn-press { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
    .btn-press:active { transform: scale(0.92); }
    
    .bar-grow { transition: height 1s cubic-bezier(0.16, 1, 0.3, 1); }
    .top-safe { top: env(safe-area-inset-top, 1rem); }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 pb-32 relative overflow-x-hidden min-h-screen">

  <!-- トースト通知 -->
  <div id="toast" class="fixed top-safe mt-4 left-4 right-4 z-[100] transform -translate-y-[150%] opacity-0 transition-all duration-300 pointer-events-none flex justify-center">
    <div class="bg-gray-900/90 backdrop-blur-md text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3">
      <i data-lucide="info" class="w-5 h-5 text-blue-400"></i>
      <span id="toast-message" class="text-sm font-bold tracking-wide"></span>
    </div>
  </div>

  <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-gray-900 to-gray-800 rounded-b-[40px] shadow-lg z-0 pointer-events-none"></div>

  <header class="px-6 pt-16 pt-safe pb-4 flex justify-between items-center relative z-10 text-white">
    <div>
      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1 flex items-center gap-1.5">
        <i data-lucide="scale" class="w-3.5 h-3.5"></i> Body Bank
      </p>
      <h1 id="header-title" class="text-3xl font-extrabold tracking-tight transition-all">体内エネルギー収支</h1>
    </div>
    <div class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/20 shadow-inner">
      <i data-lucide="user" class="text-white w-5 h-5"></i>
    </div>
  </header>

  <main class="px-4 mt-2 relative z-10">
    
    <!-- ビュー1：口座 (Wallet) -->
    <div id="view-wallet" class="space-y-5 animate-tab">
      
      <!-- メイン残高カード (月次) -->
      <div id="balance-card" class="p-6 rounded-[32px] text-white shadow-2xl transition-all duration-700 relative overflow-hidden bg-gradient-to-br from-emerald-500 to-teal-600 shadow-emerald-500/20">
        <div class="absolute -right-10 -top-10 opacity-10 mix-blend-overlay">
          <i data-lucide="trending-down" class="w-40 h-40"></i>
        </div>
        <div class="flex justify-between items-start relative z-10">
          <div>
            <p class="text-sm font-medium text-white/80 mb-1 flex items-center gap-2">
              <span id="current-month-label">今月の累計収支</span>
              <span id="alert-ping" class="hidden flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
              </span>
            </p>
            <div class="flex items-baseline gap-1 mt-1">
              <span id="monthly-balance-amount" class="text-6xl font-extrabold tracking-tighter tabular-nums transition-all duration-500">-</span>
              <span class="text-lg font-bold text-white/80">kcal</span>
            </div>
            <!-- 脂肪換算バー -->
            <div class="mt-3">
              <div class="flex justify-between text-[10px] font-bold text-white/80 mb-1">
                <span>脂肪燃焼まで</span>
                <span id="fat-burn-progress-text">0 / -7200 kcal</span>
              </div>
              <div class="h-1.5 bg-white/20 rounded-full overflow-hidden">
                <div id="fat-burn-bar" class="h-full bg-white rounded-full transition-all duration-1000" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 本日のキャッシュフロー -->
        <div class="mt-6 pt-4 border-t border-white/20 grid grid-cols-2 gap-4 relative z-10">
          <div class="flex flex-col">
            <div class="flex items-center gap-1.5 text-[11px] text-white/80 mb-0.5">
              <i data-lucide="trending-up" class="w-3 h-3 text-orange-300"></i>
              <span class="font-bold">本日の収入(食事)</span>
            </div>
            <div id="today-income-amount" class="text-xl font-extrabold tracking-tight">+0</div>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-1.5 text-[11px] text-white/80 mb-0.5">
              <i data-lucide="trending-down" class="w-3 h-3 text-blue-300"></i>
              <span class="font-bold">本日の支出(代謝+運動)</span>
            </div>
            <div id="today-expense-amount" class="text-xl font-extrabold tracking-tight text-blue-100">-0</div>
          </div>
        </div>
      </div>

      <div id="advice-card" class="rounded-[28px] p-5 bg-gradient-to-r text-white shadow-lg flex gap-4 items-start transform transition-all duration-500">
        <div class="w-14 h-14 rounded-2xl bg-white/20 backdrop-blur-md flex items-center justify-center shrink-0 text-3xl shadow-inner border border-white/30" id="advice-icon">⌛</div>
        <div>
          <div class="flex items-baseline gap-2 mb-1">
            <span id="advice-name" class="font-extrabold text-base tracking-tight">分析エンジン</span>
            <span id="advice-role" class="text-[10px] font-bold bg-white/20 px-2.5 py-0.5 rounded-full">データ同期中</span>
          </div>
          <p id="advice-text" class="text-sm font-medium leading-relaxed text-white/95">クラウドからデータを取得しています...</p>
        </div>
      </div>

      <div class="pt-2">
        <div class="flex justify-between items-end px-2 mb-4">
          <h2 class="text-2xl font-extrabold tracking-tight text-gray-900">本日の取引</h2>
          <button onclick="switchTab('calendar')" class="text-xs font-bold text-blue-600 flex items-center btn-press">明細へ <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
        </div>
        <div class="bg-white/70 backdrop-blur-xl border border-white shadow-[0_4px_24px_rgba(0,0,0,0.04)] rounded-[28px] overflow-hidden">
          <div id="transaction-list-today" class="divide-y divide-gray-100"></div>
        </div>
      </div>
    </div>

    <!-- ビュー2：分析 (Activity) -->
    <div id="view-activity" class="space-y-5 hidden animate-tab">
      <div class="bg-white/70 backdrop-blur-xl border border-white shadow-[0_4px_24px_rgba(0,0,0,0.04)] rounded-[32px] p-6">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-lg font-extrabold tracking-tight text-gray-900">週間・純収支トレンド</h2>
          <select class="bg-gray-100 text-xs font-bold text-gray-600 py-1 px-2 rounded-lg outline-none">
            <option>今週</option>
            <option>先週</option>
          </select>
        </div>
        <div class="h-40 flex items-end justify-between gap-2 relative">
          <div class="absolute left-0 right-0 bottom-16 border-t border-dashed border-gray-300 z-0"></div>
          <div class="w-full flex flex-col justify-end items-center z-10 group"><div class="w-full bg-rose-400 rounded-t-md bar-grow" style="height: 40px; margin-bottom: 64px;"></div><span class="text-[10px] font-bold text-gray-400 mt-2">月</span></div>
          <div class="w-full flex flex-col justify-end items-center z-10"><div class="w-full bg-emerald-400 rounded-b-md bar-grow transform translate-y-[100%]" style="height: 30px; margin-bottom: 64px;"></div><span class="text-[10px] font-bold text-gray-400 mt-2">火</span></div>
          <div class="w-full flex flex-col justify-end items-center z-10"><div class="w-full bg-emerald-400 rounded-b-md bar-grow transform translate-y-[100%]" style="height: 50px; margin-bottom: 64px;"></div><span class="text-[10px] font-bold text-gray-400 mt-2">水</span></div>
          <div class="w-full flex flex-col justify-end items-center z-10"><div class="w-full bg-rose-400 rounded-t-md bar-grow" style="height: 20px; margin-bottom: 64px;"></div><span class="text-[10px] font-bold text-gray-400 mt-2">木</span></div>
          <div class="w-full flex flex-col justify-end items-center z-10"><div class="w-full bg-emerald-400 rounded-b-md bar-grow transform translate-y-[100%]" style="height: 25px; margin-bottom: 64px;"></div><span class="text-[10px] font-bold text-gray-400 mt-2">金</span></div>
          <div class="w-full flex flex-col justify-end items-center z-10"><div class="w-full bg-emerald-500 rounded-b-md bar-grow transform translate-y-[100%] shadow-lg shadow-emerald-500/30" style="height: 45px; margin-bottom: 64px;"></div><span class="text-[10px] font-extrabold text-gray-900 mt-2 bg-gray-200 px-2 py-0.5 rounded-full">土</span></div>
          <div class="w-full flex flex-col justify-end items-center z-10"><div class="w-full bg-gray-200 rounded-t-md" style="height: 4px; margin-bottom: 64px;"></div><span class="text-[10px] font-bold text-gray-300 mt-2">日</span></div>
        </div>
      </div>
    </div>

    <!-- ビュー3：明細 (Calendar) -->
    <div id="view-calendar" class="space-y-5 hidden animate-tab">
      <div class="bg-white/70 backdrop-blur-xl border border-white shadow-[0_4px_24px_rgba(0,0,0,0.04)] rounded-[32px] overflow-hidden pb-4">
        <div class="bg-gray-100/50 px-5 py-2 border-b border-white">
          <span class="text-[11px] font-extrabold text-gray-500 tracking-widest">今月のすべての記録</span>
        </div>
        <div id="transaction-list-full" class="divide-y divide-gray-100"></div>
      </div>
    </div>

    <!-- ビュー4：設定 (User) -->
    <div id="view-user" class="space-y-6 hidden animate-tab">
      <div class="flex items-center gap-4 p-4">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-gray-800 to-gray-600 shadow-lg flex items-center justify-center text-white border-2 border-white">
          <i data-lucide="user" class="w-8 h-8"></i>
        </div>
        <div>
          <h2 class="text-xl font-extrabold tracking-tight">Data Analyst</h2>
          <p class="text-sm font-bold text-gray-500">ID: USER-9921</p>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <p class="px-4 text-xs font-extrabold text-gray-400 uppercase tracking-widest mb-2">AI エンジン設定</p>
          <div class="bg-white/70 backdrop-blur-xl border border-white shadow-[0_4px_24px_rgba(0,0,0,0.04)] rounded-[24px] overflow-hidden p-5">
            <div class="mb-4">
              <label class="font-extrabold text-sm text-gray-900 flex items-center gap-2 mb-2">
                <i data-lucide="key" class="w-4 h-4 text-blue-500"></i> Gemini API Key
              </label>
              <input type="password" id="api-key-input" class="w-full bg-white rounded-xl px-4 py-3 text-sm font-medium outline-none border border-gray-200 focus:border-blue-500 transition-colors shadow-inner" placeholder="AIzaSy...">
            </div>
            <button onclick="saveApiKey()" class="w-full bg-blue-50 text-blue-600 font-extrabold text-sm py-3 rounded-xl active:scale-95 transition-transform">
              端末に保存する
            </button>
          </div>
        </div>

        <div>
          <p class="px-4 text-xs font-extrabold text-gray-400 uppercase tracking-widest mb-2">システム連携</p>
          <div class="bg-white/70 backdrop-blur-xl border border-white shadow-[0_4px_24px_rgba(0,0,0,0.04)] rounded-[24px] overflow-hidden divide-y divide-gray-100">
            <div class="p-4 flex justify-between items-center">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-500 flex items-center justify-center"><i data-lucide="heart-pulse" class="w-4 h-4"></i></div>
                <div>
                  <span class="font-bold text-sm block">Apple Health 連携</span>
                  <span class="text-[10px] font-bold text-gray-400">ショートカットから受信</span>
                </div>
              </div>
              <div class="w-12 h-7 bg-emerald-500 rounded-full relative shadow-inner cursor-pointer transition-colors">
                <div class="absolute right-1 top-1 w-5 h-5 bg-white rounded-full shadow-sm"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ボトムナビゲーション -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-2xl border-t border-gray-200/50 px-6 py-2 pb-safe z-30 flex justify-between items-center shadow-[0_-20px_40px_rgba(0,0,0,0.05)]">
    <button id="nav-wallet" onclick="switchTab('wallet')" class="flex flex-col items-center gap-1 w-16 text-gray-900 btn-press">
      <i data-lucide="wallet" class="w-6 h-6" id="icon-wallet" stroke-width="2.5"></i>
      <span class="text-[10px] font-bold">口座</span>
    </button>
    <button id="nav-activity" onclick="switchTab('activity')" class="flex flex-col items-center gap-1 w-16 text-gray-400 btn-press">
      <i data-lucide="activity" class="w-6 h-6" id="icon-activity" stroke-width="2"></i>
      <span class="text-[10px] font-bold">分析</span>
    </button>
    <button onclick="openModal()" class="relative -top-6 w-16 h-16 bg-gray-900 rounded-[22px] flex items-center justify-center text-white shadow-xl shadow-gray-900/20 border-4 border-white btn-press">
      <i data-lucide="camera" class="w-7 h-7" stroke-width="2.5"></i>
    </button>
    <button id="nav-calendar" onclick="switchTab('calendar')" class="flex flex-col items-center gap-1 w-16 text-gray-400 btn-press">
      <i data-lucide="calendar" class="w-6 h-6" id="icon-calendar" stroke-width="2"></i>
      <span class="text-[10px] font-bold">明細</span>
    </button>
    <button id="nav-user" onclick="switchTab('user')" class="flex flex-col items-center gap-1 w-16 text-gray-400 btn-press">
      <i data-lucide="user" class="w-6 h-6" id="icon-user" stroke-width="2"></i>
      <span class="text-[10px] font-bold">設定</span>
    </button>
  </div>

  <!-- モーダル（食事の追加） -->
  <div id="modal" class="fixed inset-0 z-50 flex items-end justify-center px-0 pb-0 hidden">
    <div id="modal-overlay" onclick="closeModal()" class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
    <div id="modal-content" class="bg-white w-full rounded-t-[40px] p-6 relative shadow-2xl h-[85vh] flex flex-col border-t border-white/50 transform translate-y-full transition-transform duration-400 ease-out z-10">
      <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-extrabold tracking-tight">AI 記帳（自動入力）</h3>
        <button onclick="closeModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 btn-press">
          <i data-lucide="x" class="w-4 h-4" stroke-width="3"></i>
        </button>
      </div>

      <div id="analyzing-ui" class="flex-1 flex flex-col items-center justify-center space-y-6 hidden">
        <div class="relative">
           <div class="absolute inset-0 bg-gray-900/20 blur-xl rounded-2xl animate-pulse"></div>
           <div class="w-24 h-24 bg-gray-900 rounded-[28px] flex items-center justify-center relative shadow-xl border border-gray-800">
              <i data-lucide="sparkles" class="text-white w-10 h-10 animate-[spin_3s_linear_infinite]"></i>
           </div>
        </div>
        <div class="text-center">
          <p id="analyzing-title" class="text-xl font-extrabold text-gray-900 tracking-tight">AIが画像を解析中</p>
          <p id="analyzing-desc" class="text-sm font-bold text-gray-500 mt-2">料理の写真からカロリー収入を推測します...</p>
        </div>
      </div>

      <div id="input-ui" class="space-y-4 flex-1 overflow-y-auto pb-4">
        <div class="flex gap-3 mb-2">
          <div class="flex-1">
            <label class="block text-[11px] font-extrabold text-gray-400 uppercase tracking-wider mb-1.5 pl-1">カテゴリー</label>
            <div class="relative">
              <select id="meal-category" class="w-full bg-gray-100/50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold text-gray-900 outline-none appearance-none shadow-inner">
                <option value="朝食">朝食</option>
                <option value="昼食">昼食</option>
                <option value="夕食">夕食</option>
                <option value="間食">間食</option>
                <option value="夜食">夜食</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-3 top-3.5 w-4 h-4 text-gray-400 pointer-events-none"></i>
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-[11px] font-extrabold text-gray-400 uppercase tracking-wider mb-1.5 pl-1">時間</label>
            <input type="time" id="meal-time" class="w-full bg-gray-100/50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold text-gray-900 outline-none shadow-inner">
          </div>
        </div>

        <label for="image-input" id="camera-area" class="w-full aspect-video bg-gray-50 rounded-[28px] flex flex-col items-center justify-center text-gray-400 border-2 border-dashed border-gray-200 shadow-inner cursor-pointer overflow-hidden relative btn-press block mt-2">
          <div id="camera-placeholder" class="flex flex-col items-center pointer-events-none">
            <i data-lucide="camera" class="w-12 h-12 mb-3 opacity-50" stroke-width="1.5"></i>
            <p class="font-bold text-sm tracking-wide">タップして料理を撮影</p>
          </div>
          <img id="preview-img" class="absolute inset-0 w-full h-full object-cover hidden pointer-events-none" />
          <input type="file" id="image-input" accept="image/*" class="hidden">
        </label>
        
        <button onclick="analyzeAndRecord()" class="w-full py-4 bg-gray-900 text-white rounded-[24px] font-extrabold text-lg flex items-center justify-center gap-2 btn-press mt-4 shadow-xl shadow-gray-900/20">
          <i data-lucide="sparkles" class="w-5 h-5"></i> AI記帳して保存
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // システム設定
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzKcBABJsv4YyAw1QbWnM6AXrr3w6VTmaf6qMJQxn2KDsW06znPcAYJCqDJAXHaIDsIgA/exec";
    
    let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
    let selectedImageBase64 = null;
    let transactions = []; // 全データ

    // --- トースト通知機能 ---
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      const icon = toast.querySelector('i');
      msgEl.innerText = message;
      if (isError) {
        icon.setAttribute('data-lucide', 'alert-circle');
        icon.classList.replace('text-blue-400', 'text-rose-400');
        icon.classList.replace('text-emerald-400', 'text-rose-400');
      } else {
        icon.setAttribute('data-lucide', 'check-circle-2');
        icon.classList.replace('text-rose-400', 'text-emerald-400');
        icon.classList.replace('text-blue-400', 'text-emerald-400');
      }
      lucide.createIcons();
      toast.classList.remove('-translate-y-[150%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-[150%]', 'opacity-0');
      }, 3000);
    }

    function formatTime(timeStr) {
      if (!timeStr) return "--:--";
      if (typeof timeStr === 'string' && timeStr.includes('T')) {
        const d = new Date(timeStr);
        if (!isNaN(d.getTime())) {
          return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
      }
      return timeStr;
    }

    // --- 初期化 ---
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      document.getElementById('api-key-input').value = geminiApiKey;
      
      // 今月のラベルを設定 (例: "4月の累計収支")
      const now = new Date();
      document.getElementById('current-month-label').innerText = `${now.getMonth() + 1}月の累計収支`;
      
      fetchTransactions();
    });

    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      if(val) {
        localStorage.setItem('gemini_api_key', val);
        geminiApiKey = val;
        showToast('APIキーを保存しました。');
      } else {
        showToast('APIキーを入力してください。', true);
      }
    }

    // --- カメラ（画像選択）機能 ---
    document.getElementById('image-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        selectedImageBase64 = event.target.result.split(',')[1];
        document.getElementById('preview-img').src = event.target.result;
        document.getElementById('preview-img').classList.remove('hidden');
        document.getElementById('camera-placeholder').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    });

    // --- Gemini API ---
    async function callGeminiAPI(base64Image) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;
      const prompt = "この食事の写真を解析して、一般的なカロリー（kcal）と料理名、アイコンを推測してください。結果はJSONで返してください。完璧でなくて構いません。少し厳しめ（高め）に見積もってください。";
      const payload = {
        contents: [{
          parts: [
            { text: prompt },
            { inlineData: { mimeType: "image/jpeg", data: base64Image } }
          ]
        }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              name: { type: "STRING", description: "料理の簡潔な名前" },
              amount: { type: "INTEGER", description: "推測される総カロリー数(kcal)" },
              icon: { type: "STRING", description: "料理を表す絵文字1文字" }
            },
            required: ["name", "amount", "icon"]
          }
        }
      };

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("APIエラー");
      const data = await res.json();
      return JSON.parse(data.candidates[0].content.parts[0].text);
    }

    // --- フロントエンドでの解析 ＆ GASへの保存 ---
    async function analyzeAndRecord() {
      if (!geminiApiKey) {
        showToast("Gemini APIキーを設定してください。", true);
        switchTab('user');
        closeModal();
        return;
      }
      if (!selectedImageBase64) {
        showToast("料理の写真を撮影または選択してください。", true);
        return;
      }
      if(navigator.vibrate) navigator.vibrate([10, 50, 10]);
      
      const inputUI = document.getElementById('input-ui');
      const analyzingUI = document.getElementById('analyzing-ui');
      const analyzingTitle = document.getElementById('analyzing-title');
      const analyzingDesc = document.getElementById('analyzing-desc');
      
      const selectedCategory = document.getElementById('meal-category').value;
      const selectedTime = document.getElementById('meal-time').value;

      inputUI.classList.add('hidden');
      analyzingUI.classList.remove('hidden');
      
      try {
        analyzingTitle.innerText = "Gemini AI 解析中";
        analyzingDesc.innerText = "料理の写真からカロリーを推測しています...";
        
        const aiResult = await callGeminiAPI(selectedImageBase64);
        
        const newIncome = {
          type: 'income',
          category: selectedCategory,
          name: aiResult.name || "不明な料理",
          amount: aiResult.amount || 0,
          time: selectedTime,
          icon: aiResult.icon || "🍽️"
        };

        analyzingTitle.innerText = "クラウドへ同期中";
        analyzingDesc.innerText = "データをスプレッドシートに保存しています...";
        
        const gasPayload = { action: 'add', payload: newIncome };

        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          redirect: 'follow', 
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(gasPayload)
        });

        const result = await response.json();
        if (result.status === 'success') {
          // 保存成功時、現在時刻をtimestampとして付与（クライアント側での一時的な表示用）
          const record = result.data;
          record.timestamp = new Date().toISOString();
          transactions.push(record);
          updateUI();
          showToast('クラウドへの保存が完了しました！');
        } else {
          throw new Error("GASへの保存に失敗しました");
        }
      } catch (error) {
        console.error("エラー:", error);
        showToast("処理に失敗しました", true);
      } finally {
        closeModal();
      }
    }

    // ==========================================
    // UIとデータ集計ロジック (月次・日次対応)
    // ==========================================

    async function fetchTransactions() {
      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const data = await response.json();
        transactions = data;
        
        // ※ 本来は毎日の0時に基礎代謝を自動登録するGASトリガーを組むのが理想です。
        // ここでは便宜上、今日のデータに基礎代謝がなければクライアント側で補完します。
        const todayStr = new Date().toDateString();
        const hasTodayBasal = transactions.some(t => t.category === '基礎代謝' && new Date(t.timestamp).toDateString() === todayStr);
        if (!hasTodayBasal) {
          transactions.push({ id: 0, type: 'expense', category: '基礎代謝', name: '息してるだけで消費', amount: 1500, time: '00:00', icon: '🫀', timestamp: new Date().toISOString() });
        }
        
        updateUI();
      } catch (error) {
        console.error("データの取得に失敗:", error);
        showToast("データの取得に失敗しました", true);
      }
    }

    const tabTitles = { 'wallet': '体内エネルギー収支', 'activity': 'データ分析', 'calendar': '取引明細', 'user': 'システム設定' };

    function switchTab(tabId) {
      if(navigator.vibrate) navigator.vibrate(5);
      ['wallet', 'activity', 'calendar', 'user'].forEach(id => {
        document.getElementById(`view-${id}`).classList.add('hidden');
        const btn = document.getElementById(`nav-${id}`);
        btn.classList.remove('text-gray-900');
        btn.classList.add('text-gray-400');
      });
      const targetView = document.getElementById(`view-${tabId}`);
      targetView.classList.remove('hidden');
      targetView.classList.remove('animate-tab');
      void targetView.offsetWidth; 
      targetView.classList.add('animate-tab');
      
      const activeBtn = document.getElementById(`nav-${tabId}`);
      activeBtn.classList.remove('text-gray-400');
      activeBtn.classList.add('text-gray-900');
      document.getElementById('header-title').innerText = tabTitles[tabId];
    }

    function updateUI() {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      const currentDate = now.getDate();

      // --- 今月のデータと今日のデータを抽出 ---
      const monthlyTxs = [];
      const todayTxs = [];
      
      transactions.forEach(tx => {
        // timestampがない場合は便宜上今日として扱う（エラー回避）
        const txDate = tx.timestamp ? new Date(tx.timestamp) : new Date();
        
        if (txDate.getMonth() === currentMonth && txDate.getFullYear() === currentYear) {
          monthlyTxs.push(tx);
          if (txDate.getDate() === currentDate) {
            todayTxs.push(tx);
          }
        }
      });

      // --- 月次計算（メイン残高用） ---
      const monthlyIncome = monthlyTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
      const monthlyExpense = monthlyTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);
      const monthlyBalance = monthlyIncome - monthlyExpense;
      const isSurplus = monthlyBalance > 0;

      // --- 日次計算（キャッシュフロー用） ---
      const todayIncome = todayTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
      const todayExpense = todayTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);

      // UIに反映
      document.getElementById('monthly-balance-amount').innerText = (isSurplus ? '+' : '') + monthlyBalance;
      document.getElementById('today-income-amount').innerText = '+' + todayIncome;
      document.getElementById('today-expense-amount').innerText = '-' + todayExpense;

      // メインカードの色変更
      const balanceCard = document.getElementById('balance-card');
      const alertPing = document.getElementById('alert-ping');
      if (isSurplus) {
        balanceCard.className = "p-6 rounded-[32px] text-white shadow-2xl transition-all duration-700 relative overflow-hidden bg-gradient-to-br from-rose-500 to-red-600 shadow-rose-500/20";
        alertPing.classList.remove('hidden');
      } else {
        balanceCard.className = "p-6 rounded-[32px] text-white shadow-2xl transition-all duration-700 relative overflow-hidden bg-gradient-to-br from-emerald-500 to-teal-600 shadow-emerald-500/20";
        alertPing.classList.add('hidden');
      }

      // 脂肪燃焼プログレスバー（-7200kcalで1kg）
      const fatBurnGoal = -7200;
      let progressPercent = 0;
      if (monthlyBalance < 0) {
        // 赤字幅が大きいほどバーが伸びる
        progressPercent = Math.min((monthlyBalance / fatBurnGoal) * 100, 100);
      }
      document.getElementById('fat-burn-bar').style.width = `${progressPercent}%`;
      document.getElementById('fat-burn-progress-text').innerText = `${monthlyBalance} / ${fatBurnGoal} kcal (脂肪換算: ${(monthlyBalance/7200).toFixed(2)} kg)`;

      // アドバイス更新
      const advice = getAdvice(monthlyBalance, isSurplus);
      const adviceCard = document.getElementById('advice-card');
      adviceCard.className = `rounded-[28px] p-5 bg-gradient-to-r ${advice.gradient} text-white shadow-lg flex gap-4 items-start transform transition-all duration-500`;
      document.getElementById('advice-icon').innerText = advice.icon;
      document.getElementById('advice-name').innerText = advice.name;
      document.getElementById('advice-role').innerText = advice.role;
      document.getElementById('advice-text').innerText = advice.text;

      // リストの生成（降順ソート）
      const sortedTodayTxs = [...todayTxs].sort((a, b) => b.time.localeCompare(a.time));
      const sortedMonthlyTxs = [...monthlyTxs].sort((a, b) => {
        const dateA = a.timestamp ? new Date(a.timestamp) : new Date();
        const dateB = b.timestamp ? new Date(b.timestamp) : new Date();
        return dateB - dateA;
      });

      document.getElementById('transaction-list-today').innerHTML = generateTxHtml(sortedTodayTxs);
      document.getElementById('transaction-list-full').innerHTML = generateTxHtml(sortedMonthlyTxs, true); // 月次明細は日付も表示
      
      lucide.createIcons();
    }

    function generateTxHtml(txArray, showDate = false) {
      if(txArray.length === 0) return `<div class="p-4 text-center text-sm font-bold text-gray-400">取引データがありません</div>`;
      
      return txArray.map(tx => {
        let dateLabel = "";
        if (showDate && tx.timestamp) {
          const d = new Date(tx.timestamp);
          dateLabel = `<span class="text-[10px] font-bold text-gray-400 mr-2">${d.getMonth()+1}/${d.getDate()}</span>`;
        }
        
        return `
        <div class="p-4 flex items-center gap-4 active:bg-gray-100 transition-colors cursor-pointer">
          <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shrink-0 shadow-inner border ${tx.type === 'income' ? 'bg-orange-50 border-orange-100 text-orange-600' : 'bg-blue-50 border-blue-100 text-blue-600'}">
            ${tx.icon}
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-[15px] font-bold text-gray-900 truncate tracking-tight">${tx.name}</h3>
            <div class="flex items-center gap-2 mt-1">
              ${dateLabel}
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md whitespace-nowrap ${tx.type === 'income' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}">${tx.category}</span>
              <span class="text-xs text-gray-400 font-bold whitespace-nowrap">${formatTime(tx.time)}</span>
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-lg font-extrabold tracking-tighter tabular-nums ${tx.type === 'income' ? 'text-orange-500' : 'text-blue-500'}">
              ${tx.type === 'income' ? '+' : '-'}${tx.amount}
            </div>
            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-wider">kcal</span>
          </div>
        </div>
      `}).join('');
    }

    function getAdvice(monthlyBalance, isSurplus) {
      if (isSurplus) {
        return { name: "月次アラート", role: "黒字（カロリー超過）", text: "今月は累計で黒字化（カロリー過多）しています。このまま月末を迎えると、脂肪として確定申告されてしまいます。早急に運動でマイナスを作ってください。", gradient: "from-rose-500 to-red-500", icon: "🚨" };
      } else if (monthlyBalance > -3600) {
        return { name: "分析エンジン", role: "赤字（順調）", text: "順調な赤字経営です。徐々に体内エネルギーの枯渇（脂肪燃焼）が進んでいます。この調子で今月の決算まで赤字幅を広げていきましょう。", gradient: "from-blue-500 to-indigo-500", icon: "📊" };
      } else {
        return { name: "分析エンジン", role: "大赤字（大成功）", text: "驚異的な大赤字です！すでに脂肪0.5kg相当以上のエネルギーを内部から切り崩しています。完璧な運用実績として評価されます。", gradient: "from-emerald-400 to-teal-500", icon: "📉" };
      }
    }

    const modal = document.getElementById('modal');
    const overlay = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');

    function openModal() {
      if(navigator.vibrate) navigator.vibrate(10);
      
      document.getElementById('preview-img').src = "";
      document.getElementById('preview-img').classList.add('hidden');
      document.getElementById('camera-placeholder').classList.remove('hidden');
      selectedImageBase64 = null;
      document.getElementById('image-input').value = "";
      
      const now = new Date();
      document.getElementById('meal-time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      const h = now.getHours();
      let defaultCategory = "間食";
      if (h >= 5 && h < 10) defaultCategory = "朝食";
      else if (h >= 10 && h < 15) defaultCategory = "昼食";
      else if (h >= 17 && h < 22) defaultCategory = "夕食";
      else if (h >= 22 || h < 5) defaultCategory = "夜食";
      document.getElementById('meal-category').value = defaultCategory;

      modal.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        overlay.classList.add('opacity-100');
        content.classList.remove('translate-y-full');
        content.classList.add('translate-y-0');
      }, 10);
    }

    function closeModal() {
      overlay.classList.remove('opacity-100');
      overlay.classList.add('opacity-0');
      content.classList.remove('translate-y-0');
      content.classList.add('translate-y-full');
      setTimeout(() => {
        modal.classList.add('hidden');
        document.getElementById('input-ui').classList.remove('hidden');
        document.getElementById('analyzing-ui').classList.add('hidden');
      }, 400); 
    }
  </script>
